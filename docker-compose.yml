version: '3.8'

services:
  backend:
    build: ./backend
    container_name: hdb_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hdb_buyer
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db/hdb_buyer
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: hdb_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hdb_buyer
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: hdb_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
